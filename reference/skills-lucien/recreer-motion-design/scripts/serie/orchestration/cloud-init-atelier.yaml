#cloud-config
package_update: true
packages: [tmux, ffmpeg, python3-venv, python3-pip, git, curl, jq, unzip, rsync, fonts-liberation, libnss3, libatk1.0-0t64, libatk-bridge2.0-0t64, libcups2t64, libdrm2, libxkbcommon0, libxcomposite1, libxdamage1, libxfixes3, libxrandr2, libgbm1, libasound2t64, libpango-1.0-0, libcairo2]
runcmd:
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  - npm i -g @anthropic-ai/claude-code
  - python3 -m venv /opt/whisper && /opt/whisper/bin/pip install -q faster-whisper
  - mkdir -p /srv/faq-v4 && touch /srv/faq-v4/cloud-init.done
